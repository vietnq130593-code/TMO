# TMO QUALITY GATE — CI pipeline (GitHub Actions)
#
# Chạy FULL gate (type_check → lint → tests → build thử) trên MỌI push lên main
# và mọi pull_request vào main. Đây là lớp enforcement bên phía GitHub — dù
# local có bỏ hook (--no-verify), commit đỏ vẫn bị đánh dấu ở đây.
#
# Bật chế độ chặn hẳn tại GitHub (khuyến nghị, làm 1 lần bằng tay):
#   Repo → Settings → Branches → Add branch protection rule cho `main`:
#     ✔ Require status checks to pass before merging → chọn job `quality-gate`
#     ✔ Require branches to be up to date before merging
#
# Lưu ý kỹ thuật:
# - Không cần .env trên CI: tests stage tự tạo DB SQLite cô lập
#   (db/.quality-gate-test.db) qua prisma db push; build không đụng DB.
# - Build thử ghi ra .next-qa (TMO_BUILD_DIST_DIR) — không đổi hành vi gì khác.

name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: type_check + lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        # postinstall tự chạy `prisma generate`

      - name: Run Quality Gate (type_check → lint → tests → build)
        run: bun scripts/quality-gate.mjs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
